    let currentIdx = 0;
    let scores = { ambition: 0, wisdom: 0, romantic: 0, steady: 0 };
    let baseTestCount = 12450;

    function init() { document.getElementById('q-total').innerText = questions.length; }

    function startQuiz() {
        document.getElementById('page-cover').classList.remove('active');
        document.getElementById('page-quiz').classList.add('active');
        currentIdx = 0;
        for (let k in scores) scores[k] = 0;
        renderQ();
    }

    function renderQ() {
        if (currentIdx >= questions.length) { calcResult(); return; }
        const q = questions[currentIdx];
        document.getElementById('q-current').innerText = currentIdx + 1;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('progress-fill').style.width = (currentIdx / questions.length * 100) + '%';
        
        const box = document.getElementById('options-container');
        box.innerHTML = '';
        const shuffled = q.opts.sort(() => Math.random() - 0.5);
        shuffled.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'option';
            div.innerText = opt.t;
            div.onclick = () => selectOpt(div, opt.val);
            box.appendChild(div);
        });
    }

    function selectOpt(el, val) {
        if (document.getElementById('options-container').classList.contains('lock')) return;
        document.getElementById('options-container').classList.add('lock');
        
        document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');

        for (let k in val) { if (scores[k] !== undefined) scores[k] += val[k]; }

        setTimeout(() => {
            document.getElementById('options-container').classList.remove('lock');
            currentIdx++;
            renderQ();
        }, 250);
    }

    function calcCosineSimilarity(v1, v2) {
        let dotProduct = 0;
        let mag1 = 0;
        let mag2 = 0;
        for (let k in v1) {
            dotProduct += v1[k] * v2[k];
            mag1 += Math.pow(v1[k], 2);
            mag2 += Math.pow(v2[k], 2);
        }
        if (mag1 === 0 || mag2 === 0) return 0;
        return dotProduct / (Math.sqrt(mag1) * Math.sqrt(mag2));
    }

    function calcResult() {
        document.getElementById('page-quiz').classList.remove('active');
        document.getElementById('page-result').classList.add('active');

        let nowCount = baseTestCount + Math.floor(Math.random() * 5) + 1;
        document.getElementById('test-count-badge').innerText = `🎉 你是第 ${nowCount} 个找到历史剧本的人`;

        let bestFigure = null;
        let maxSimilarity = -1; 

        figures.forEach(figure => {
            let sim = calcCosineSimilarity(scores, figure.dim);
            // 加入微量随机扰动，避免完全一样
            sim += (Math.random() * 0.001); 
            if (sim > maxSimilarity) { 
                maxSimilarity = sim; 
                bestFigure = figure; 
            }
        });

        document.getElementById('res-name').innerText = bestFigure.name;
        const tagBox = document.getElementById('res-tags');
        tagBox.innerHTML = '';
        bestFigure.tags.forEach(t => {
            const s = document.createElement('span');
            s.className = 'tag';
            s.innerText = '#' + t;
            tagBox.appendChild(s);
        });
        document.getElementById('res-content').innerHTML = bestFigure.text;
    }

    function restartQuiz() {
        document.getElementById('page-result').classList.remove('active');
        document.getElementById('page-cover').classList.add('active');
    }

    window.onload = init;
</script>
